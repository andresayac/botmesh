packages:
  - 'packages/*'
  - 'examples/*'

allowBuilds:
  # Optional peer of @botmesh/ai: its preinstall is a no-op.
  '@google/genai': false
  '@whiskeysockets/baileys': true
  better-sqlite3: true
  esbuild: true
  # Optional peer of @botmesh/baileys; its install script downloads a binary. The
  # workspace uses the system ffmpeg (or FFMPEG_PATH) instead.
  ffmpeg-static: false
  protobufjs: true
